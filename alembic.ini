# Alembic Configuration for FreeStack

[alembic]
# Template for migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps
timezone = UTC

# Maximum length of slug
max_slug_length = 40

# Truncate slug to max length
truncate_slug_length = 40

# Version location
version_locations = alembic/versions

# SQLAlchemy URL (overridden by env var in env.py)
sqlalchemy.url = postgresql+asyncpg://freestack:freestack@localhost:5432/freestack

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S