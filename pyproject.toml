[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freestack"
version = "0.1.0"
description = "A production-grade, modular full-stack development framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FreeStack Contributors", email = "dev@freestack.dev"}
]
maintainers = [
    {name = "FreeStack Core Team", email = "core@freestack.dev"}
]
keywords = [
    "framework", "full-stack", "api", "cli", "async", "fastapi",
    "sqlalchemy", "redis", "postgresql", "background-jobs", "websocket"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "arq>=0.23.0",
    "apscheduler>=3.10.4",
    "websockets>=12.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "cerberus>=1.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.92.0",
    "testcontainers>=4.7.0",
    "factory-boy>=3.3.0",
    "faker>=25.1.0",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-autorefs>=1.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.92.0",
    "testcontainers>=4.7.0",
    "factory-boy>=3.3.0",
    "faker>=25.1.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-autorefs>=1.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/freestack"
Repository = "https://github.com/yourorg/freestack"
Documentation = "https://docs.freestack.dev"
Issues = "https://github.com/yourorg/freestack/issues"
Changelog = "https://github.com/yourorg/freestack/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["freestack*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args
    "C901",  # too complex (allow in some cases)
    "T201",  # print statements (allow in CLI/scripts)
    "PTH118", # os.path usage (allow in some cases)
    "ARG001", # unused argument (allow in some cases)
    "ARG002", # unused argument (allow in some cases)
]
per-file-ignores = {
    "tests/*": ["T201", "S101", "PLR2004", "ERA001"],
    "scripts/*": ["T201", "S101"],
    "docs/*": ["T201"],
}
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".coverage",
    "node_modules",
    ".idea",
    ".vscode",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.black]
target-version = ["py311"]
line-length = 100
skip-string-normalization = true
preview = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["freestack"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
enable_error_code = [
    "arg-type",
    "attr-defined",
    "dict-type",
    "has-type",
    "import",
    "list-type",
    "literal",
    "misc",
    "name-defined",
    "no-untyped-def",
    "override",
    "return-value",
    "set-type",
    "tuple-type",
    "type-arg",
    "union-type",
    "valid-type",
]
exclude = [
    "build",
    "dist",
    ".venv",
    "venv",
    "env",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
    "htmlcov",
    "node_modules",
]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--disable-warnings",
    "-x",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require external services)",
    "slow: Slow tests",
    "benchmark: Performance benchmarks",
    "security: Security-related tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["freestack"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/scripts/*",
]
branch = true
parallel = true
concurrency = "multiprocessing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.pre-commit-ci]
autofix = true
autofix_prs = true
autoupdate_schedule = "weekly"
skip = []

[tool.pre-commit-hooks.hooks]
# See .pre-commit-config.yaml for actual hooks
# This section is for IDE integration hints
check-existence = true
check-merged = true