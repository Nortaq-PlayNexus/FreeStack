# cloudflared-config.yml - named tunnel mapping public hostnames to localhost.
# Generated by cloudflared-setup.sh. Edit the hostname field to your free domain (12).
# Docs: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/yaml-configuration/
tunnel: YOUR_TUNNEL_ID_HERE
credentials-file: /root/.cloudflared/YOUR_TUNNEL_ID_HERE.json

ingress:
  - hostname: app.YOUR_DOMAIN
    service: http://localhost:8080
  - hostname: api.YOUR_DOMAIN
    service: http://localhost:8000
  - hostname: ssh.YOUR_DOMAIN        # raw TCP to a local SSH daemon
    service: ssh://localhost:22
  # catch-all: respond 404 for unknown hostnames
  - service: http_status:404
