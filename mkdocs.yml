site_name: FreeStack Documentation
site_description: A production-grade, modular full-stack development framework
site_author: FreeStack Contributors
site_url: https://nortaq-playnexus.github.io/FreeStack/
repo_url: https://github.com/Nortaq-PlayNexus/FreeStack
repo_name: Nortaq-PlayNexus/FreeStack
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 FreeStack Contributors

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
  - Guides:
      - Development: guides/development.md
      - Deployment: guides/deployment.md
      - Configuration: guides/configuration.md
      - Security: guides/security.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true