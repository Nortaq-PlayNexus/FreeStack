version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: freestack-postgres
    environment:
      POSTGRES_DB: freestack
      POSTGRES_USER: freestack
      POSTGRES_PASSWORD: freestack
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freestack -d freestack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - freestack-network
    restart: unless-stopped

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: freestack-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - freestack-network
    restart: unless-stopped

  # RabbitMQ (Alternative message queue)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: freestack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: freestack
      RABBITMQ_DEFAULT_PASS: freestack
      RABBITMQ_DEFAULT_VHOST: freestack
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - freestack-network
    restart: unless-stopped
    profiles:
      - messaging

  # FreeStack API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: freestack-api
    environment:
      FREESTACK_DATABASE_URL: postgresql+asyncpg://freestack:freestack@postgres:5432/freestack
      FREESTACK_REDIS_URL: redis://redis:6379/0
      FREESTACK_SECRET_KEY: ${FREESTACK_SECRET_KEY:-dev-secret-key-change-in-production}
      FREESTACK_ENVIRONMENT: development
      FREESTACK_LOG_LEVEL: DEBUG
      FREESTACK_API_HOST: 0.0.0.0
      FREESTACK_API_PORT: 8000
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - freestack-network
    restart: unless-stopped

  # FreeStack Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: freestack-worker
    command: freestack worker start --concurrency 4
    environment:
      FREESTACK_DATABASE_URL: postgresql+asyncpg://freestack:freestack@postgres:5432/freestack
      FREESTACK_REDIS_URL: redis://redis:6379/0
      FREESTACK_SECRET_KEY: ${FREESTACK_SECRET_KEY:-dev-secret-key-change-in-production}
      FREESTACK_ENVIRONMENT: development
      FREESTACK_LOG_LEVEL: INFO
      FREESTACK_WORKER_CONCURRENCY: 4
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freestack-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # FreeStack WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: freestack-websocket
    command: freestack ws serve
    environment:
      FREESTACK_DATABASE_URL: postgresql+asyncpg://freestack:freestack@postgres:5432/freestack
      FREESTACK_REDIS_URL: redis://redis:6379/0
      FREESTACK_SECRET_KEY: ${FREESTACK_SECRET_KEY:-dev-secret-key-change-in-production}
      FREESTACK_ENVIRONMENT: development
      FREESTACK_LOG_LEVEL: INFO
      FREESTACK_WS_HOST: 0.0.0.0
      FREESTACK_WS_PORT: 8001
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freestack-network
    restart: unless-stopped

  # FreeStack Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: freestack-scheduler
    command: freestack scheduler start
    environment:
      FREESTACK_DATABASE_URL: postgresql+asyncpg://freestack:freestack@postgres:5432/freestack
      FREESTACK_REDIS_URL: redis://redis:6379/0
      FREESTACK_SECRET_KEY: ${FREESTACK_SECRET_KEY:-dev-secret-key-change-in-production}
      FREESTACK_ENVIRONMENT: development
      FREESTACK_LOG_LEVEL: INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freestack-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: freestack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - websocket
    networks:
      - freestack-network
    restart: unless-stopped
    profiles:
      - proxy

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: freestack-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - freestack-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: freestack-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - freestack-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  freestack-network:
    driver: bridge
    name: freestack-network